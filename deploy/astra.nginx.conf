# ASTRA Terminal — reverse proxy for a dedicated subdomain.
# Copy to /etc/nginx/sites-available/astra, replace __DOMAIN__, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`, then add SSL with:
#   sudo certbot --nginx -d __DOMAIN__
# This is a SEPARATE server block — your existing site is untouched.

server {
    listen 80;
    server_name __DOMAIN__;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Optional password gate (the app itself has no login). Create the file with:
    #   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.astra_htpasswd youruser
    # then uncomment:
    # auth_basic           "ASTRA";
    # auth_basic_user_file /etc/nginx/.astra_htpasswd;
}
